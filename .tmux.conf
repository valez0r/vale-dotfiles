# ~/.tmux.conf
 
# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0
 
# Increase scrollback buffer
set -g history-limit 50000
 
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber-windows
set -g renumber-windows on

# Rename window to dir instead of process
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Make new windows start after current
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"
 
# Enable mouse support
set -g mouse off
 
# Enable focus events for vim autoread
set -g focus-events on
 
# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
 
# Aggressive resize for multi-client
setw -g aggressive-resize on
 
# ============================================
# KEY BINDINGS
# ============================================
 
# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-space
bind C-space send-prefix
 
# Make new windows start after current
bind c new-window -a -c "#{pane_current_path}"
bind C new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind j select-pane -L
bind i select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vim-style splits/
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Window swapping
bind -r Left swap-window -t -1 \; select-window -t -1
bind -r Right swap-window -t +1 \; select-window -t +1

# Correctly pass modified keys to processes running in tmux
# set -g extended-keys on
# set -g extended-keys-format csi-u
 
# ============================================
# APPEARANCE
# ============================================
 
# Status bar position
set -g status-position top
set -g status-justify left

# Status bar colors
set -g status-style 'bg=#A26B35 fg=#8b949e'
# set -g status-style 'bg=default'
set -g status-left-length 20
# set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=#1F2528,bold] #S #[fg=#30363d]│ '
# set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '
set -g status-right ''

# Window status
#setw -g window-status-format ' #I:#W '
# setw -g window-status-current-format '#[fg=#00e68a,bold] #I:#W '
setw -g window-status-separator ''
setw -g window-status-format '  #I:#W #F  '
setw -g window-status-style 'bg=default,fg=#1F2528'
setw -g window-status-current-format '  #I:#W #F  '
setw -g window-status-current-style 'bg=default,fg=#800200,bold'

# Pane border colors
set -g pane-border-lines single
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#ffb000'
 
# Pane scrollbars — show scrollback position (tmux 3.6+)
# set -g pane-scrollbars on
# set -g pane-scrollbars-position right
 
# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'
 
# ============================================
# COPY MODE
# ============================================
 
# Use vim keys
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection
set -g allow-passthrough on
set -s set-clipboard on
setw -g mode-style 'fg=#a7d8b0' 

# ============================================
# NOTIFICATIONS
# ============================================

# Agent notifications
setw -g monitor-bell on
set -g bell-action other # only monitor bells in windows not currently open
setw -g window-status-bell-style 'fg=#ffbf00 underscore'
